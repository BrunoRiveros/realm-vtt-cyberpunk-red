<div style="display: flex; gap: 4px; align-items: center">
  <div style="width: 30px; min-width: 30px">
    <portrait width="30px" height="30px" name="portrait"></portrait>
  </div>
  <div style="flex-grow: 1">
    <namefield
      size="xs"
      variant="standard"
      placeholder="Name..."
      multiline="true"
      field="namefield"
    ></namefield>
  </div>
  <div style="width: 160px">
    <stringfield
      size="xs"
      variant="tooltip"
      label="Job"
      field="job"
      placeholder="Enter Job Title..."
    ></stringfield>
  </div>
  <div style="width: 60px">
    <numberfield
      size="xs"
      variant="tooltip"
      label="Loyalty"
      field="loyalty"
      placeholder="0"
    >
    </numberfield>
  </div>
</div>
