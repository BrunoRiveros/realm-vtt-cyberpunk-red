<script>
  function rollAttack(type, range = "auto") {
    // Close the popover if it's open
    api.closeOpenedPopovers();
    // Get weapon path
    const weaponDataPath = getNearestParentDataPath(dataPath);
    const weapon = api.getValue(weaponDataPath);

    performAttackRoll(record, weapon, weaponDataPath, type, range);
  }

  function rollDamage(type = "single") {
    const weaponDataPath = getNearestParentDataPath(dataPath);
    const weapon = api.getValue(weaponDataPath);

    performDamageRoll(record, weapon, type);
  }

  function reload() {
    // Check if we have enough ammo then deduct ammo up to amount in magazine
    const weaponDataPath = getNearestParentDataPath(dataPath);
    const weapon = api.getValue(weaponDataPath);

    if (weapon.data?.type === "melee weapon") {
      return;
    }

    let magazineSize = weapon.data?.magazine || 0;
    // Check all attachments for magazine size, get largest
    const attachments = weapon.data?.attachments || [];
    attachments.forEach((attachment) => {
      if (
        attachment.data?.attachmentType === "magazine" &&
        attachment.data?.magazineSize > magazineSize &&
        attachment.data?.active
      ) {
        magazineSize = attachment.data?.magazineSize;
      }
    });

    const amountInWeapon = parseInt(weapon.data?.ammoCount, 10) || 0;
    const amountToReload = magazineSize - amountInWeapon;

    if (amountToReload <= 0) {
      return; // Already full
    }

    const ammo = weapon.data?.ammo;
    if (!ammo) {
      api.showNotification(
        "You need to select equipped ammo first!",
        "red",
        "No Ammo"
      );
      return;
    }

    const ammoObject = JSON.parse(ammo);

    let hasEnoughAmmo = false;
    const inventory = record.data?.inventory || [];
    inventory.forEach((item, index) => {
      if (item._id === ammoObject?._id) {
        const count = parseInt(item.data?.count, 10) || 0;
        if (count > 0) {
          // Calculate how much we can actually reload
          const amountToDeduct = Math.min(count, amountToReload);
          const newCount = count - amountToDeduct;
          api.setValues({
            [`data.inventory.${index}.data.count`]: newCount,
            [`${weaponDataPath}.data.ammoCount`]:
              amountInWeapon + amountToDeduct,
          });
          hasEnoughAmmo = true;
        }
      }
    });

    if (!hasEnoughAmmo) {
      api.showNotification("You are out of ammo!", "red", "Out of Ammo");
    }
  }

  function showHideAttachments() {
    const dataPathToWeapon = getNearestParentDataPath(dataPath);
    const weapon = api.getValue(dataPathToWeapon);

    let pathToAttachmentFields = "fields";
    if (dataPathToWeapon !== "") {
      pathToAttachmentFields = `${dataPathToWeapon}.fields`;
    }

    const showingAttachments = weapon?.fields?.attachments?.hidden !== true;
    const attachments = weapon?.data?.attachments || [];
    // If we're showing attachments list and we no have attachments, then hide it
    const showAttachments = attachments.length > 0;

    const dot = dataPathToWeapon !== "" ? "." : "";

    if (showingAttachments && !showAttachments) {
      api.setValues({
        [`${pathToAttachmentFields}.attachments.hidden`]: true,
      });
    } else if (!showingAttachments && showAttachments) {
      api.setValues({
        [`${pathToAttachmentFields}.attachments.hidden`]: false,
      });
    }

    // Hide the attack divider box if this is an attachment
    const isAttachment = dataPath.match(/\.data\.attachments\.\d+/) !== null;
    const isShowingAttackDivider =
      weapon?.fields?.attackDividerBox?.hidden !== true;
    if (isAttachment && isShowingAttackDivider) {
      api.setValues({
        [`${pathToAttachmentFields}.attackDividerBox.hidden`]: true,
        [`${pathToAttachmentFields}.attackDividerBox.hidden`]: true,
      });
    }
  }

  function onChangeAmmo(value) {
    const weaponDataPath = dataPath.replace(".data.ammo", "");
    const weapon = api.getValue(weaponDataPath);

    // Get the Ammo item
    const selectedAmmo = value;
    if (selectedAmmo) {
      try {
        const ammoId = JSON.parse(selectedAmmo)?._id;
        if (ammoId) {
          let ammoIndex = -1;
          const ammo = record.data.inventory.find((item, index) => {
            if (item._id === ammoId) {
              ammoIndex = index;
              return true;
            }
            return false;
          });
          if (ammo) {
            // Found the ammo
            const hasUseSpecial =
              ammo?.data?.useDamage ||
              (ammo?.data?.effects || []).length > 0 ||
              (ammo?.data?.conditions || []).length > 0 ||
              (ammo?.data?.checkDV || 0) > 0 ||
              ammo?.data?.healing;
            api.setValues({
              [`${weaponDataPath}.fields.useSpecialBtn.hidden`]: !hasUseSpecial,
            });
          }
        }
      } catch (error) {
        // Do nothing on JSON parse error
      }
    }
  }

  function getCyberwareWeaponFilters() {
    // Cyberware weapons are not carried, so we need to cancel that filter out
    const filters = [
      {
        field: "carried",
        operation: "not_equals",
        value: "carried",
        isOr: true,
      },
    ];
    return filters;
  }

  function ammoOptions() {
    // Get a list of equipped ammo
    let equippedAmmo = record.data?.inventory?.filter(
      (item) => item.data.carried === "equipped" && item.data.type === "ammo"
    );

    // If this is an NPC, don't worry if the ammo is not equipped
    if (record.recordType === "npcs") {
      equippedAmmo = record.data?.inventory?.filter(
        (item) => item.data.type === "ammo"
      );
    }

    if (equippedAmmo.length > 0) {
      return equippedAmmo.map((ammo) => ({
        value: JSON.stringify({
          _id: ammo._id,
          name: ammo.name,
          isShell: ammo.data.isShell,
        }),
        label: ammo.name,
      }));
    } else {
      return [{ value: "none", label: "None" }];
    }
  }

  function useAmmo() {
    const weaponDataPath = dataPath.replace(".data.useSpecialBtn", "");
    const weapon = api.getValue(weaponDataPath);

    // Get the Ammo item
    const selectedAmmo = weapon?.data?.ammo;
    if (selectedAmmo) {
      const ammoId = JSON.parse(selectedAmmo)?._id;
      if (ammoId) {
        let ammoIndex = -1;
        const ammo = record.data.inventory.find((item, index) => {
          if (item._id === ammoId) {
            ammoIndex = index;
            return true;
          }
          return false;
        });
        if (ammo) {
          // Found the ammo, now use it
          useItem(record, `data.inventory.${ammoIndex}`);
        }
      }
    }
  }
</script>
