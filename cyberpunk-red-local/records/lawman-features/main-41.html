<div style="display: flex; gap: 4px; align-items: flex-start">
  <div style="width: 60px">
    <numberfield
      size="xs"
      variant="tooltip"
      label="Rank"
      field="rank"
      placeholder="0"
    >
    </numberfield>
  </div>
  <div
    style="
      flex-grow: 1;
      display: flex;
      flex-direction: row;
      gap: 4px;
      width: 100%;
    "
  >
    <div style="width: 100%">
      <namefield
        size="xs"
        field="name"
        variant="standard"
        placeholder="Backup Name..."
      ></namefield>
    </div>
    <div style="width: 100%">
      <dropdown
        size="xs"
        field="backup"
        placeholder="Select Backup..."
        optionsquery='{"type": "npcs", "query": {"data.type": "backup"}}'
      ></dropdown>
    </div>
  </div>
</div>
