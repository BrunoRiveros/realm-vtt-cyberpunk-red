<div style="display: flex; flex-direction: column; gap: 4px; width: 100%">
  <div style="display: flex; gap: 4px; align-items: flex-start">
    <div style="width: 100px">
      <numberfield
        size="xs"
        label="Passive DV"
        field="passiveDV"
        placeholder="0"
      >
      </numberfield>
    </div>
    <div style="width: 100px">
      <numberfield size="xs" label="Active DV" field="activeDV" placeholder="0">
      </numberfield>
    </div>
    <stringfield
      size="xs"
      field="rumorType"
      label="Rumor Type"
      placeholder="Enter Rumor Type..."
    ></stringfield>
  </div>
  <div style="width: 100%">
    <stringfield
      size="xs"
      field="rumor"
      label="Rumor Description"
      placeholder="Enter Rumor Description..."
      multiline="true"
    ></stringfield>
  </div>
</div>
