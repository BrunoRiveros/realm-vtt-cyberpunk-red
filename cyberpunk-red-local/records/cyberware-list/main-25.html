<!-- This list is just the foundational cyberware equipped for a specific type -->
<script>
  const rollHumanityLoss = (name) => {
    const cyberwareDataPath = getNearestParentDataPath(dataPath);
    const cyberware = api.getValue(cyberwareDataPath);
    const baseLoss = `${cyberware.data?.baseHumanityLoss}` || "0";
    const rollLoss = cyberware.data?.humanityLoss || "1d6";
    const metadata = {
      // Always use base loss if base is selected, else check if half loss is enabled
      halfHumanityLoss:
        name === "Base" ? false : cyberware.data?.halfHumanityLoss || false,
      isBaseLoss: name === "Base",
    };

    api.closeOpenedPopovers();

    api.promptRoll(
      `${name} Humanity Loss`,
      name === "Base" ? baseLoss : rollLoss,
      [],
      metadata,
      "humanityLoss"
    );
  };

  function onMove(newLocation) {
    const cyberwareDataPath = getNearestParentDataPath(dataPath);
    const cyberware = api.getValue(cyberwareDataPath);

    // If the new location is 'gear' we need to set the withinGear field to true
    if (newLocation === "gear") {
      cyberware.data.withinGear = true;
      const valuesToSet = {};
      valuesToSet[`${cyberwareDataPath}.data.withinGear`] = true;
      valuesToSet[`${cyberwareDataPath}.fields.moveToGearBtn.hidden`] = true;
      valuesToSet[
        `${cyberwareDataPath}.fields.removeFromGearBtn.hidden`
      ] = false;
      // Additionally, we hide the humanity loss button
      valuesToSet[`${cyberwareDataPath}.fields.humanityLossBtn.hidden`] = true;
      // We also need to update humanity
      const bestEquippedArmor = getBestEquippedArmor(record);
      updateAttributes(valuesToSet, bestEquippedArmor.highestPenalty);
      api.setValues(valuesToSet, (updatedRecord) => {
        setCyberwareSlotValues(updatedRecord);
      });
    } else if (newLocation === "removeFromGear") {
      // If the new location is 'removeFromGear' we need to set the withinGear field to false
      cyberware.data.withinGear = false;
      const valuesToSet = {};
      valuesToSet[`${cyberwareDataPath}.data.withinGear`] = false;
      valuesToSet[`${cyberwareDataPath}.fields.moveToGearBtn.hidden`] = false;
      valuesToSet[
        `${cyberwareDataPath}.fields.removeFromGearBtn.hidden`
      ] = true;
      // Show the humanity loss button if it has any
      if (cyberware.data.humanityLoss !== undefined) {
        valuesToSet[
          `${cyberwareDataPath}.fields.humanityLossBtn.hidden`
        ] = false;
      }
      // We also need to update humanity
      const bestEquippedArmor = getBestEquippedArmor(record);
      updateAttributes(valuesToSet, bestEquippedArmor.highestPenalty);
      api.setValues(valuesToSet, (updatedRecord) => {
        setCyberwareSlotValues(updatedRecord);
      });
    } else {
      // Moves the cyberware in an arm/eye/leg to the left or right table
      const valuesToSet = {};
      valuesToSet[`${cyberwareDataPath}.data.cyberLocation`] = newLocation;
      // Hide/unhide the move buttons
      valuesToSet[`${cyberwareDataPath}.fields.moveLeftBtn.hidden`] =
        newLocation === "left" ? true : false;
      valuesToSet[`${cyberwareDataPath}.fields.moveRightBtn.hidden`] =
        newLocation === "right" ? true : false;

      api.setValues(valuesToSet, (updatedRecord) => {
        // Update the cyberware slot values
        setCyberwareSlotValues(updatedRecord);
      });
    }
  }
</script>

<!-- Two-line row: portrait on the left, item name on its own line, and the
     action controls on a second line so the name is never crowded. -->
<div
  class="rvtt-cpr-row"
  style="
    display: flex;
    flex-direction: row;
    gap: 6px;
    align-items: center;
    padding: 3px 2px;
    min-height: 46px;
  "
>
  <div style="width: 40px; min-width: 40px">
    <portrait width="40px" height="40px" name="portrait"></portrait>
  </div>
  <div
    style="
      flex-grow: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    "
  >
    <namefield
      size="xs"
      variant="standard"
      placeholder="Item"
      field="namefield"
      width="100%"
    ></namefield>
    <div
      style="display: flex; flex-direction: row; gap: 4px; align-items: center"
    >
      <checkbox field="active" size="xs" label="Active"></checkbox>
      <popover field="popover">
        <popover.target>
          <iconbutton
            size="sm"
            hidden="true"
            field="humanityLossBtn"
            variant="default"
            options='[{"icon": "IconBrain", "label": "Roll Humanity Loss", "value": "humanityLoss"}]'
          ></iconbutton>
        </popover.target>
        <popover.dropdown>
          <label
            size="sm"
            variant="bold"
            textalign="center"
            label="Humanity Loss"
          ></label>
          <div style="display: flex; gap: 4px; align-items: center">
            <button
              field="baseLossBtn"
              size="sm"
              variant="outline"
              color="primary"
              label="Apply Base Loss"
              onclick="rollHumanityLoss('Base')"
            ></button>
            <button
              field="rollLossBtn"
              size="sm"
              variant="outline"
              color="secondary"
              label="Roll for Loss"
              onclick="rollHumanityLoss('Roll')"
            ></button>
          </div>
        </popover.dropdown>
      </popover>
      <iconbutton
        field="moveToGearBtn"
        size="sm"
        variant="default"
        options='[{"icon": "IconBackpack", "label": "Move to Gear Section", "value": "moveToGear"}]'
        onclick="onMove('gear')"
      ></iconbutton>
      <iconbutton
        field="removeFromGearBtn"
        size="sm"
        hidden="true"
        variant="default"
        options='[{"icon": "IconBackpackOff", "label": "Remove from Gear", "value": "removeFromGear"}]'
        onclick="onMove('removeFromGear')"
      ></iconbutton>
      <iconbutton
        field="moveLeftBtn"
        size="sm"
        hidden="true"
        variant="default"
        options='[{"icon": "IconArrowRight", "label": "Move to Left", "value": "moveLeft"}]'
        onclick="onMove('left')"
      ></iconbutton>
      <iconbutton
        field="moveRightBtn"
        size="sm"
        hidden="true"
        variant="default"
        options='[{"icon": "IconArrowLeft", "label": "Move to Right", "value": "moveRight"}]'
        onclick="onMove('right')"
      ></iconbutton>
    </div>
  </div>
</div>
