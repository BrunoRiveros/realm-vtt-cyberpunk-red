<script>
  function onPanelChange(value) {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const role = api.getValue(nearestParentDataPath) || record;

    // If this is an nested item, just return. (Like a weapon attachment)
    let pathToFields = "fields";
    if (nearestParentDataPath !== "") {
      pathToFields = `${nearestParentDataPath}.fields`;
    }
    let pathToData = "data";
    if (nearestParentDataPath !== "") {
      pathToData = `${nearestParentDataPath}.data`;
    }

    const valuesToSet = {
      [`${pathToFields}.execProperties.hidden`]:
        value === "exec" ? false : true,
      [`${pathToFields}.fixerProperties.hidden`]:
        value === "fixer" ? false : true,
      [`${pathToFields}.lawmanProperties.hidden`]:
        value === "lawman" ? false : true,
      [`${pathToFields}.mediaProperties.hidden`]:
        value === "media" ? false : true,
      [`${pathToFields}.medtechProperties.hidden`]:
        value === "medtech" ? false : true,
      [`${pathToFields}.netrunnerProperties.hidden`]:
        value === "netrunner" ? false : true,
      [`${pathToFields}.nomadProperties.hidden`]:
        value === "nomad" ? false : true,
      [`${pathToFields}.rockerboyProperties.hidden`]:
        value === "rockerboy" ? false : true,
      [`${pathToFields}.soloProperties.hidden`]:
        value === "solo" ? false : true,
      [`${pathToFields}.techProperties.hidden`]:
        value === "tech" ? false : true,
      [`${pathToFields}.customProperties.hidden`]:
        value === "custom" ? false : true,
    };

    api.setValues(valuesToSet);
  }
</script>
