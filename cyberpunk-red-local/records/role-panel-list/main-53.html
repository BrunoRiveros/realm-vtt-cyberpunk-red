<script>
  function moveUp() {
    const dataPathToRole = dataPath.replace(".data.moveUpBtn", "");
    const role = api.getValue(dataPathToRole);
    const thisOrder = role.data?.order || 1;

    if (thisOrder === 1) {
      return;
    }

    // Get all roles to find the one directly previous in order
    const roles = record.data?.roles || [];

    if (!roles || !Array.isArray(roles)) {
      return;
    }

    // Find the role with the next lowest order (the one directly above this one)
    let previousRole = null;
    let previousRoleDataPath = "";
    let previousOrder = 0;
    roles.forEach((r, roleIndex) => {
      const orderValue = r.data?.order || 0;
      if (orderValue < thisOrder && orderValue > previousOrder) {
        previousOrder = orderValue;
        previousRole = r;
        previousRoleDataPath = `data.roles.${roleIndex}`;
      }
    });

    if (!previousRole) {
      return; // No previous role found
    }

    // Swap the orders of the two roles
    const valuesToSet = {
      [`${dataPathToRole}.data.order`]: previousOrder,
      [`${previousRoleDataPath}.data.order`]: thisOrder,
    };

    api.setValues(valuesToSet, (updatedRecord) => {
      updateRoles(updatedRecord);
    });
  }

  function getFiltersForActiveFeaturesList() {
    // Only show features where rank is <= our own rank
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const role = api.getValue(nearestParentDataPath);
    if (!role) {
      return [];
    }

    const rank = role.data?.rank || 1;

    const filters = [...Array(rank).keys()].map((i) => ({
      field: "rank",
      operator: "equals",
      value: i + 1,
      isOr: true,
    }));

    return filters;
  }

  function getFiltersForCryosystemFeaturesList() {
    // Only show features where rank is <= our cryosystem operation
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const role = api.getValue(nearestParentDataPath);
    if (!role) {
      return [];
    }

    const cryosystemOperation = role.data?.cryosystemOperation || 0;

    if (cryosystemOperation === 0) {
      return [
        {
          field: "rank",
          operator: "equals",
          value: 0,
          isOr: true,
        },
      ];
    }

    const filters = [...Array(cryosystemOperation).keys()].map((i) => ({
      field: "rank",
      operator: "equals",
      value: i + 1,
      isOr: true,
    }));

    return filters;
  }

  function updateRank() {
    updateRoles(record);
  }

  function canAddExecTeamMember() {
    return value?.data?.type === "team member";
  }

  function rollHaggle() {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const role = api.getValue(nearestParentDataPath);

    // HAGGLE is COOL + Trading Skill + Operator Rank + 1d10 against
    // NPC COOL + Trading Skill + Their Operator Rank (if they are a Fixer) + 1d10.
    performSkillRoll(record, "Trading", {
      isDodge: false,
      defenderSkill: "Trading",
      roleAbility: "Fixer",
      abilityName: "Haggle",
    });
  }

  function rollRumors(type) {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const role = api.getValue(nearestParentDataPath);
    const rumors = role.data?.rumors || [];

    // Store possible results and associated DVs
    const results = [];
    rumors.forEach((rumor) => {
      results.push({
        result: `(${rumor.data?.rumorType}) ${rumor.data?.rumor}`,
        type: "rumor",
        dv: type === "passive" ? rumor.data?.passiveDV : rumor.data?.activeDV,
      });
    });

    if (type === "passive") {
      // Roll 1d10 + Role Rank against the table
      performSkillRoll(record, "Passive Rumors", {
        isDodge: false,
        roleAbility: "Media",
        dvTable: results,
      });
    } else if (type === "active") {
      // Roll 1d10 + Chosen Skill against the table
      performSkillRoll(record, "Library Search", {
        isDodge: false,
        abilityName: "Active Rumors",
        dvTable: results,
      });
    }
  }

  function rollBelievability() {
    // This is a roll under rank ability, using the evidence bonus
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const role = api.getValue(nearestParentDataPath);
    const evidenceBonus = role.data?.evidenceBonus || 0;

    // Get DV by rank
    const rank = role.data?.rank || 1;
    let dv = role.data?.believabilityDV1 || 0;
    if (role.data?.rank === 2) {
      dv = role.data?.believabilityDV2 || 0;
    } else if (role.data?.rank === 3) {
      dv = role.data?.believabilityDV3 || 0;
    } else if (role.data?.rank === 4) {
      dv = role.data?.believabilityDV4 || 0;
    } else if (role.data?.rank === 5) {
      dv = role.data?.believabilityDV5 || 0;
    } else if (role.data?.rank === 6) {
      dv = role.data?.believabilityDV6 || 0;
    } else if (role.data?.rank === 7) {
      dv = role.data?.believabilityDV7 || 0;
    } else if (role.data?.rank === 8) {
      dv = role.data?.believabilityDV8 || 0;
    } else if (role.data?.rank === 9) {
      dv = role.data?.believabilityDV9 || 0;
    } else {
      dv = role.data?.believabilityDV10 || 0;
    }

    performSkillRoll(record, "Believability", {
      isDodge: false,
      roleAbility: "Media",
      abilityName: "Believability",
      rollUnderOrEqual: true,
      bonus: evidenceBonus,
      dv: dv,
    });
  }

  function updateSurgery() {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const role = api.getValue(nearestParentDataPath);
    const roleRank = role.data?.rank || 0;
    const surgery = role.data?.surgery || 0;
    const pharmaceuticals = role.data?.pharmaceuticals || 0;
    const cryosystemOperation = role.data?.cryosystemOperation || 0;
    // Set surgey skill level to 2 * surgery
    const surgerySkillLevel = surgery * 2;

    // Set unallocated ranks to role rank - surgery - med tech - pharmaceuticals - cryosystem operation
    const unallocatedRanks =
      roleRank - surgery - pharmaceuticals - cryosystemOperation;

    api.setValues({
      [`${nearestParentDataPath}.data.surgerySkillLevel`]: surgerySkillLevel,
      [`${nearestParentDataPath}.data.unallocatedRanks`]: unallocatedRanks,
    });
  }

  function updatePharmaceuticals() {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const role = api.getValue(nearestParentDataPath);
    const roleRank = role.data?.rank || 0;
    const surgery = role.data?.surgery || 0;
    const pharmaceuticals = role.data?.pharmaceuticals || 0;
    const cryosystemOperation = role.data?.cryosystemOperation || 0;

    // Set unallocated ranks to role rank - surgery - med tech - pharmaceuticals - cryosystem operation
    const unallocatedRanks =
      roleRank - surgery - pharmaceuticals - cryosystemOperation;
    // Set medical tech to pharmaceuticals + cryosystem operation
    const medicalTech = pharmaceuticals + cryosystemOperation;

    api.setValues({
      [`${nearestParentDataPath}.data.unallocatedRanks`]: unallocatedRanks,
      [`${nearestParentDataPath}.data.medicalTech`]: medicalTech,
    });
  }

  function updateCryosystemOperation() {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const role = api.getValue(nearestParentDataPath);
    const roleRank = role.data?.rank || 0;
    const surgery = role.data?.surgery || 0;
    const pharmaceuticals = role.data?.pharmaceuticals || 0;
    const cryosystemOperation = role.data?.cryosystemOperation || 0;

    // Set unallocated ranks to role rank - surgery - med tech - pharmaceuticals - cryosystem operation
    const unallocatedRanks =
      roleRank - surgery - pharmaceuticals - cryosystemOperation;
    // Set medical tech to pharmaceuticals + cryosystem operation
    const medicalTech = pharmaceuticals + cryosystemOperation;

    api.setValues({
      [`${nearestParentDataPath}.data.unallocatedRanks`]: unallocatedRanks,
      [`${nearestParentDataPath}.data.medicalTech`]: medicalTech,
    });
  }

  function rollSurgery() {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const role = api.getValue(nearestParentDataPath);
    const surgery = role.data?.surgery || 0;
    const surgerySkillLevel = role.data?.surgerySkillLevel || 0;

    performSkillRoll(record, "Surgery", {
      isDodge: false,
      roleAbility: "Medtech",
      abilityName: "Surgery",
      skillLevel: surgerySkillLevel,
      statName: "tech",
    });
  }

  function rollMedicalTech() {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const role = api.getValue(nearestParentDataPath);
    const medicalTech = role.data?.medicalTech || 0;

    performSkillRoll(record, "Medical Tech", {
      isDodge: false,
      roleAbility: "Medtech",
      abilityName: "Medical Tech",
      skillLevel: medicalTech,
      statName: "tech",
    });
  }

  function rollSynthesize() {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const role = api.getValue(nearestParentDataPath);
    // Synthesize is a DV 13 Medical Tech check
    const medicalTech = role.data?.medicalTech || 0;
    const dv = role.data?.synthesisDV || 13;

    performSkillRoll(record, "Synthesize", {
      isDodge: false,
      roleAbility: "Medtech",
      abilityName: "Medical Tech",
      skillLevel: medicalTech,
      statName: "tech",
      dv: dv,
    });
  }

  function isPharmaceutical(value) {
    return value?.data?.type === "drug";
  }

  function rollInterface(abilityName = "Interface") {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const role = api.getValue(nearestParentDataPath);
    // 'interface' is a strict-mode reserved word; use interfaceLevel instead.
    const interfaceLevel = role.data?.rank || 0;

    let defenderSkill = undefined;
    if (abilityName === "Zap") {
      defenderSkill = "Interface or DEF";
    } else if (abilityName === "Destroy") {
      defenderSkill = "ATK";
    } else if (abilityName === "Slide") {
      defenderSkill = "PER";
    }

    performSkillRoll(record, "Interface", {
      isDodge: false,
      roleAbility: "Netrunner",
      defenderSkill: defenderSkill,
      abilityName: abilityName,
      skillLevel: interfaceLevel,
    });
  }

  function rollZapDamage() {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const role = api.getValue(nearestParentDataPath);
    const zapDamage = role.data?.zapDamage || "1d6";

    const modifiers = [];
    const damageMetadata = {
      rollName: "Damage",
      tooltip: "Damage with Zap",
      weaponName: "Zap",
      isMelee: false,
      targetedLocation: "body",
      ignoresArmorUnder: 100,
      nonLethal: false,
      nonLethalGreaterThanOne: false,
      noArmorAblation: true,
      noCriticalInjuries: true,
    };

    if (record.linked === undefined) {
      api.promptRoll(
        `ZAP Damage`,
        zapDamage,
        modifiers,
        damageMetadata,
        "damage"
      );
    } else {
      api.promptRollForToken(
        record,
        `Damage with ${weapon.name}`,
        damage,
        modifiers,
        damageMetadata,
        "damage"
      );
    }
  }

  function rollVehicleFamiliarity(abilityName) {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const role = api.getValue(nearestParentDataPath);
    // The bonus is their rank in the Nomad Role
    const vehicleFamiliarity = role.data?.rank || 0;

    performSkillRoll(record, abilityName, {
      isDodge: false,
      roleAbility: "Moto",
      abilityName: "Vehicle Familiarity",
      bonus: vehicleFamiliarity,
    });
  }

  function rollCharismaticImpact(groupSize) {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const role = api.getValue(nearestParentDataPath);

    let dv = role.data?.singleImpactDV || 0;
    if (groupSize === "small") {
      dv = role.data?.groupImpactDV || 0;
    } else if (groupSize === "huge") {
      dv = role.data?.hugeGroupImpactDV || 0;
    }

    performSkillRoll(record, "Charismatic Impact", {
      isDodge: false,
      roleAbility: "Rockerboy",
      abilityName: "Charismatic Impact",
      dv: dv,
    });
  }

  function updateSoloRanks() {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const role = api.getValue(nearestParentDataPath);

    // Número entero, nunca negativo
    const toNum = (v) => Math.max(0, Math.floor(Number(v) || 0));

    const roleRank = toNum(role.data?.rank);

    // Tope individual de cada habilidad
    const caps = {
      damageDeflectionRank: Infinity,
      fumbleRecoveryRank: 2,
      initiativeReactionRank: Infinity,
      precisionAttackRank: 6,
      spotWeaknessRank: Infinity,
      threatDetectionRank: Infinity,
    };

    // Valores tal como están guardados
    const stored = {};
    for (const key in caps) {
      stored[key] = role.data?.[key];
    }

    // Detectar qué habilidad se acaba de editar y usar el valor nuevo
    const changedKey = String(dataPath || "").split(".").pop();
    const isRankField = changedKey in caps;
    let typedValue;
    if (isRankField) {
      typedValue =
        typeof value !== "undefined" ? value : api.getValue(dataPath);
    }

    // Construir los rangos efectivos, con su tope
    const ranks = {};
    for (const key in caps) {
      const raw = key === changedKey ? typedValue : stored[key];
      ranks[key] = Math.min(caps[key], toNum(raw));
    }

    const sumRanks = () =>
      Object.values(ranks).reduce((total, v) => total + v, 0);

    let excess = sumRanks() - roleRank;

    // Si se pasa del rango, primero recortar la habilidad editada
    if (excess > 0 && isRankField) {
      const cut = Math.min(excess, ranks[changedKey]);
      ranks[changedKey] -= cut;
      excess -= cut;
    }

    // Si aún sobra (valores viejos o rango bajado), recortar desde abajo
    for (const key of Object.keys(caps).reverse()) {
      if (excess <= 0) break;
      const cut = Math.min(excess, ranks[key]);
      ranks[key] -= cut;
      excess -= cut;
    }

    const unallocatedRanks = roleRank - sumRanks();
    const damageReduction = Math.min(5, Math.floor(ranks.damageDeflectionRank / 2));
    const attackBonus = Math.min(3, Math.floor(ranks.precisionAttackRank / 2));

    const updates = {
      [`${nearestParentDataPath}.data.unallocatedRanks`]: unallocatedRanks,
      [`${nearestParentDataPath}.data.damageReduction`]: damageReduction,
      [`${nearestParentDataPath}.data.attackBonus`]: attackBonus,
    };

    // Solo reescribir habilidades que hubo que corregir
    for (const key in caps) {
      const original = key === changedKey ? typedValue : stored[key];
      if (Number(original) !== ranks[key]) {
        updates[`${nearestParentDataPath}.data.${key}`] = ranks[key];
      }
    }

    api.setValues(updates);
  }

  function updateTechRanks() {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const role = api.getValue(nearestParentDataPath);
    const roleRank = role.data?.rank || 0;

    // Techs get to allocate 2 ranks in 2 differenet tech skills per role
    // Set unallocated ranks to (role rank * 2) - all tech ranks
    let unallocatedRanks = roleRank * 2;

    const fieldExpertiseRank = role.data?.fieldExpertiseRank || 0;
    const upgradeExpertiseRank = role.data?.upgradeExpertiseRank || 0;
    const fabricationExpertiseRank = role.data?.fabricationExpertiseRank || 0;
    const inventionExpertiseRank = role.data?.inventionExpertiseRank || 0;

    unallocatedRanks =
      unallocatedRanks -
      fieldExpertiseRank -
      upgradeExpertiseRank -
      fabricationExpertiseRank -
      inventionExpertiseRank;

    api.setValues({
      [`${nearestParentDataPath}.data.unallocatedRanks`]: unallocatedRanks,
      [`${nearestParentDataPath}.data.maxFieldExpertise`]:
        fieldExpertiseRank + unallocatedRanks,
      [`${nearestParentDataPath}.data.maxUpgradeExpertise`]:
        upgradeExpertiseRank + unallocatedRanks,
      [`${nearestParentDataPath}.data.maxFabricationExpertise`]:
        fabricationExpertiseRank + unallocatedRanks,
      [`${nearestParentDataPath}.data.maxInventionExpertise`]:
        inventionExpertiseRank + unallocatedRanks,
    });
  }

  function rollTechSkill(makerSkill) {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const role = api.getValue(nearestParentDataPath);
    const techSkill = role.data?.techSkill || "Basic Tech";

    // Get bonus by skill, unless Field Expertise which adds it by the effects mod
    let bonus = role.data?.fieldExpertiseRank || 0;
    if (makerSkill === "Upgrade Exertise") {
      bonus = role.data?.upgradeExpertiseRank || 0;
    } else if (makerSkill === "Invention Expertise") {
      bonus = role.data?.inventionExpertiseRank || 0;
    } else if (makerSkill === "Fabrication Expertise") {
      bonus = role.data?.fabricationExpertiseRank || 0;
    }

    // Get DV by cost category
    let dv = role.data?.dvCheapEveryday || 9;
    if (
      role.data?.costCategory === "CheapEveryday" ||
      !role.data?.costCategory
    ) {
      dv = role.data?.dvCheapEveryday;
    } else if (role.data?.costCategory === "Costly") {
      dv = role.data?.dvCostly;
    } else if (role.data?.costCategory === "Premium") {
      dv = role.data?.dvPremium;
    } else if (role.data?.costCategory === "Expensive") {
      dv = role.data?.dvExpensive;
    } else if (role.data?.costCategory === "Very Expensive") {
      dv = role.data?.dvVeryExpensive;
    } else if (role.data?.costCategory === "Luxary") {
      dv = role.data?.dvLuxary;
    } else if (role.data?.costCategory === "Super Luxary") {
      dv = role.data?.dvSuperLuxary;
    }

    performSkillRoll(record, techSkill, {
      isDodge: false,
      roleAbility: "Tech",
      abilityName: makerSkill,
      subRoleRank: bonus,
      dv: dv,
    });
  }
</script>
