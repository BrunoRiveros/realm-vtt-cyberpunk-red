<div style="display: flex; flex-direction: row; gap: 4px; width: 100%">
  <div style="width: 120px">
    <stringfield
      size="xs"
      field="rumorType"
      placeholder="Type..."
      variant="standard"
    ></stringfield>
  </div>
  <div style="width: 100%">
    <stringfield
      size="xs"
      width="100%"
      field="rumor"
      placeholder="Enter Rumor Description..."
      variant="standard"
      multiline="true"
    ></stringfield>
  </div>
  <div style="width: 120px">
    <numberfield
      size="xs"
      label="Passive DV"
      field="passiveDV"
      placeholder="0"
      variant="tooltip"
    ></numberfield>
  </div>
  <div style="width: 120px">
    <numberfield
      size="xs"
      label="Active DV"
      field="activeDV"
      placeholder="0"
      variant="tooltip"
    ></numberfield>
  </div>
</div>
