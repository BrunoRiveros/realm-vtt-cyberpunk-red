<script>
  function showHideValues(typeStr) {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const item = api.getValue(nearestParentDataPath) || record;

    // If this is an nested item, just return. (Like a weapon attachment)
    let pathToFields = "fields";
    if (nearestParentDataPath !== "") {
      pathToFields = `${nearestParentDataPath}.fields`;
    }
    let pathToData = "data";
    if (nearestParentDataPath !== "") {
      pathToData = `${nearestParentDataPath}.data`;
    }

    const valuesToSet = {
      [`${pathToFields}.weaponProperties.hidden`]: true,
      [`${pathToFields}.dvProperties.hidden`]: true,
      [`${pathToFields}.packProperties.hidden`]: true,
      [`${pathToFields}.rangedWeaponProperties.hidden`]: true,
      [`${pathToFields}.weaponType.hidden`]: true,
      [`${pathToFields}.ammoType.hidden`]: true,
      [`${pathToFields}.magazine.hidden`]: true,
      [`${pathToFields}.weaponAttachmentProperties.hidden`]: true,
      [`${pathToFields}.attachmentsProperties.hidden`]: true,
      [`${pathToFields}.maxSlots.hidden`]: true,
      [`${pathToFields}.ammoProperties.hidden`]: true,
      [`${pathToFields}.armorProperties.hidden`]: true,
      [`${pathToFields}.blackICEProperties.hidden`]: true,
      [`${pathToFields}.demonProperties.hidden`]: true,
      [`${pathToFields}.droneProperties.hidden`]: true,
      [`${pathToFields}.programProperties.hidden`]: true,
      [`${pathToFields}.vehicleProperties.hidden`]: true,
      [`${pathToFields}.cyberdeckProperties.hidden`]: true,
      [`${pathToFields}.cyberwareProperties.hidden`]: true,
      [`${pathToFields}.weaponAttachedLabel.hidden`]: true,
      [`${pathToFields}.weaponAttached.hidden`]: true,
      [`${pathToFields}.cyberwareWeaponLabel.hidden`]: true,
      [`${pathToFields}.vehicleUpgradeProperties.hidden`]: true,
      [`${pathToFields}.drugProperties.hidden`]: true,
      [`${pathToFields}.consumableProperties.hidden`]:
        item?.data?.consumable || item?.data?.hasUseBtn ? false : true,
      [`${pathToFields}.animationProps.hidden`]: true,
      // The below fields are only displayed on the attack list
      [`${pathToFields}.generalWeaponProperties.hidden`]: true,
      [`${pathToFields}.cyberwareWeaponProperties.hidden`]: true,
      [`${pathToFields}.attackDividerBox.hidden`]: false,
      [`${pathToFields}.autoFireBtn.hidden`]: true,
      [`${pathToFields}.suppressiveFireBtn.hidden`]: true,
      [`${pathToFields}.attackByRangeBtn.hidden`]: true,
      [`${pathToFields}.reloadBtn.hidden`]: true,
      [`${pathToFields}.ammo.hidden`]: true,
      [`${pathToFields}.useSpecialBtn.hidden`]: true,
      [`${pathToFields}.ammoCount.hidden`]: true,
      [`${pathToFields}.curheadSp.hidden`]: true,
      [`${pathToFields}.curbodySp.hidden`]: true,
      [`${pathToFields}.curshieldSp.hidden`]: true,
    };

    if (typeStr === "agent app") {
      valuesToSet[`${pathToFields}.consumable.hidden`] = true;
      valuesToSet[`${pathToFields}.hasUseBtn.hidden`] = false;
    } else if (typeStr === "ammo") {
      valuesToSet[`${pathToFields}.consumable.hidden`] = true;
      valuesToSet[`${pathToFields}.hasUseBtn.hidden`] = true;
      valuesToSet[`${pathToFields}.ammoProperties.hidden`] = false;
      valuesToSet[`${pathToFields}.consumableProperties.hidden`] = false;
    } else if (typeStr === "armor") {
      valuesToSet[`${pathToFields}.consumable.hidden`] = true;
      valuesToSet[`${pathToFields}.hasUseBtn.hidden`] = false;
      valuesToSet[`${pathToFields}.armorProperties.hidden`] = false;
      valuesToSet[`${pathToFields}.curheadSp.hidden`] = true;
      valuesToSet[`${pathToFields}.curbodySp.hidden`] = true;
      valuesToSet[`${pathToFields}.curshieldSp.hidden`] = true;
    } else if (typeStr === "black ice") {
      valuesToSet[`${pathToFields}.consumable.hidden`] = true;
      valuesToSet[`${pathToFields}.hasUseBtn.hidden`] = false;
      valuesToSet[`${pathToFields}.blackICEProperties.hidden`] = false;
    } else if (typeStr === "cyberdeck") {
      valuesToSet[`${pathToFields}.consumable.hidden`] = true;
      valuesToSet[`${pathToFields}.hasUseBtn.hidden`] = true;
      valuesToSet[`${pathToFields}.cyberdeckProperties.hidden`] = false;
      valuesToSet[`${pathToFields}.maxSlots.hidden`] = false;
    } else if (typeStr === "cyberware") {
      valuesToSet[`${pathToFields}.consumable.hidden`] = true;
      valuesToSet[`${pathToFields}.hasUseBtn.hidden`] = true;
      valuesToSet[`${pathToFields}.cyberwareProperties.hidden`] = false;
      valuesToSet[`${pathToFields}.cyberwareWeaponLabel.hidden`] = false;
      valuesToSet[`${pathToFields}.weaponAttached.hidden`] = false;
      valuesToSet[`${pathToFields}.cyberwareWeaponProperties.hidden`] = false;
      valuesToSet[`${pathToFields}.attackDividerBox.hidden`] = true;
    } else if (typeStr === "demon") {
      valuesToSet[`${pathToFields}.consumable.hidden`] = true;
      valuesToSet[`${pathToFields}.hasUseBtn.hidden`] = false;
      valuesToSet[`${pathToFields}.demonProperties.hidden`] = false;
    } else if (typeStr === "drone") {
      valuesToSet[`${pathToFields}.consumable.hidden`] = true;
      valuesToSet[`${pathToFields}.hasUseBtn.hidden`] = false;
      valuesToSet[`${pathToFields}.droneProperties.hidden`] = false;
    } else if (typeStr === "drug") {
      valuesToSet[`${pathToFields}.drugProperties.hidden`] = false;
      valuesToSet[`${pathToFields}.consumable.hidden`] = true;
      valuesToSet[`${pathToFields}.hasUseBtn.hidden`] = true;
      valuesToSet[`${pathToFields}.consumableProperties.hidden`] = false;
    } else if (typeStr === "fashion") {
      valuesToSet[`${pathToFields}.consumable.hidden`] = true;
      valuesToSet[`${pathToFields}.hasUseBtn.hidden`] = true;
    } else if (typeStr === "gear") {
      valuesToSet[`${pathToFields}.consumable.hidden`] = false;
      valuesToSet[`${pathToFields}.hasUseBtn.hidden`] = false;
    } else if (typeStr === "melee weapon") {
      valuesToSet[`${pathToFields}.consumable.hidden`] = true;
      valuesToSet[`${pathToFields}.hasUseBtn.hidden`] = false;
      valuesToSet[`${pathToFields}.weaponProperties.hidden`] = false;
      valuesToSet[`${pathToFields}.weaponType.hidden`] = false;
      valuesToSet[`${pathToFields}.attachmentsProperties.hidden`] = false;
      valuesToSet[`${pathToFields}.maxSlots.hidden`] = false;
      valuesToSet[`${pathToFields}.generalWeaponProperties.hidden`] = false;
      valuesToSet[`${pathToFields}.animationProps.hidden`] = false;
      // Defaults for melee weapons
      valuesToSet[`${pathToData}.weaponSkill`] = "Brawling";
      valuesToSet[`${pathToData}.rof`] = "1";
      valuesToSet[`${pathToData}.handsRequired`] = "1";
      valuesToSet[`${pathToData}.quality`] = "average";
      valuesToSet[`${pathToData}.exotic`] = "false";
      valuesToSet[`${pathToData}.concealable`] = "false";
    } else if (typeStr === "program or hardware") {
      valuesToSet[`${pathToFields}.consumable.hidden`] = true;
      valuesToSet[`${pathToFields}.hasUseBtn.hidden`] = false;
      valuesToSet[`${pathToFields}.programProperties.hidden`] = false;
    } else if (typeStr === "ranged weapon") {
      valuesToSet[`${pathToFields}.consumable.hidden`] = true;
      valuesToSet[`${pathToFields}.hasUseBtn.hidden`] = false;
      valuesToSet[`${pathToFields}.weaponProperties.hidden`] = false;
      valuesToSet[`${pathToFields}.rangedWeaponProperties.hidden`] = false;
      valuesToSet[`${pathToFields}.ammoType.hidden`] = false;
      valuesToSet[`${pathToFields}.magazine.hidden`] = false;
      valuesToSet[`${pathToFields}.dvProperties.hidden`] = false;
      valuesToSet[`${pathToFields}.attachmentsProperties.hidden`] = false;
      valuesToSet[`${pathToFields}.maxSlots.hidden`] = false;
      valuesToSet[`${pathToFields}.generalWeaponProperties.hidden`] = false;
      valuesToSet[`${pathToFields}.attackByRangeBtn.hidden`] = false;
      valuesToSet[`${pathToFields}.reloadBtn.hidden`] = false;
      valuesToSet[`${pathToFields}.ammo.hidden`] = false;
      valuesToSet[`${pathToFields}.ammoCount.hidden`] = false;
      valuesToSet[`${pathToFields}.animationProps.hidden`] = false;
      // Defaults for ranged weapons
      valuesToSet[`${pathToData}.weaponSkill`] = "Archery";
      valuesToSet[`${pathToData}.rof`] = "1";
      valuesToSet[`${pathToData}.handsRequired`] = "1";
      valuesToSet[`${pathToData}.quality`] = "average";
      valuesToSet[`${pathToData}.exotic`] = "false";
      valuesToSet[`${pathToData}.concealable`] = "false";
    } else if (typeStr === "pack") {
      valuesToSet[`${pathToFields}.consumable.hidden`] = true;
      valuesToSet[`${pathToFields}.hasUseBtn.hidden`] = true;
      valuesToSet[`${pathToFields}.packProperties.hidden`] = false;
    } else if (typeStr === "vehicle") {
      valuesToSet[`${pathToFields}.consumable.hidden`] = true;
      valuesToSet[`${pathToFields}.hasUseBtn.hidden`] = false;
      valuesToSet[`${pathToFields}.vehicleProperties.hidden`] = false;
    } else if (typeStr === "vehicle upgrade") {
      valuesToSet[`${pathToFields}.consumable.hidden`] = true;
      valuesToSet[`${pathToFields}.hasUseBtn.hidden`] = true;
      valuesToSet[`${pathToFields}.vehicleUpgradeProperties.hidden`] = false;
    } else if (typeStr === "weapon attachment") {
      valuesToSet[`${pathToFields}.consumable.hidden`] = true;
      valuesToSet[`${pathToFields}.hasUseBtn.hidden`] = false;
      valuesToSet[`${pathToFields}.weaponAttachmentProperties.hidden`] = false;
      valuesToSet[`${pathToFields}.slots.hidden`] = false;
    } else {
      valuesToSet[`${pathToFields}.consumable.hidden`] = true;
      valuesToSet[`${pathToFields}.hasUseBtn.hidden`] = true;
    }

    api.setValues(valuesToSet);
  }

  function showHideAttachments() {
    // The attack list will hide this field there, if there are none.
    // But we need to show it here for editing, always
    const dataPathToWeapon = dataPath.replace(/[.]?data.attachments/, "");
    const weapon = api.getValue(dataPathToWeapon);

    const isWeapon =
      weapon?.data?.type === "ranged weapon" ||
      weapon?.data?.type === "melee weapon";

    const showingAttachments = weapon?.fields?.attachments?.hidden !== true;

    const dot = dataPathToWeapon !== "" ? "." : "";

    if (isWeapon && !showingAttachments) {
      api.setValues({
        [`${dataPathToWeapon}${dot}fields.attachments.hidden`]: false,
      });
    }
  }

  function isAttachment(value) {
    return value.data?.type === "weapon attachment";
  }

  function isWeapon(value) {
    return (
      value.data?.type === "ranged weapon" ||
      value.data?.type === "melee weapon"
    );
  }

  function onHumanityLossChange(value) {
    // Sett the humanity loss button to unhidden
    const cyberwareDataPath = dataPath.replace(/data.humanityLoss[.]?/, "");
    api.setValues({
      [`${cyberwareDataPath}fields.humanityLossBtn.hidden`]:
        value === "" || value === undefined,
    });
  }

  function onAttachmentTypeChange(value) {
    // Rebuild the attachment data path incase this is a nested item
    let attachmentDataPath = dataPath.replace(/data.attachmentType[.]?/, "");
    const valuesToSet = {
      [`${attachmentDataPath}fields.dvProperties.hidden`]: true,
      [`${attachmentDataPath}fields.afDvProperties.hidden`]: true,
      [`${attachmentDataPath}fields.magazineSize.hidden`]: true,
      [`${attachmentDataPath}fields.weaponAttached.hidden`]: true,
      [`${attachmentDataPath}fields.weaponAttachedLabel.hidden`]: true,
    };

    if (value === "altRange") {
      valuesToSet[`${attachmentDataPath}fields.dvProperties.hidden`] = false;
      valuesToSet[`${attachmentDataPath}fields.afDvProperties.hidden`] = false;
    } else if (value === "magazine") {
      valuesToSet[`${attachmentDataPath}fields.magazineSize.hidden`] = false;
    } else if (value === "weapon") {
      valuesToSet[`${attachmentDataPath}fields.weaponAttached.hidden`] = false;
      valuesToSet[
        `${attachmentDataPath}fields.weaponAttachedLabel.hidden`
      ] = false;
    }

    api.setValues(valuesToSet);
  }

  function onProgramHardwareTypeChange(value) {
    let programDataPath = dataPath.replace(/data.programHardwareType[.]?/, "");
    const valuesToSet = {
      [`${programDataPath}fields.program.hidden`]: true,
      [`${programDataPath}fields.programLabel.hidden`]: true,
    };

    if (
      value.toLowerCase() === "hardware" ||
      value.toLowerCase() === "quickhack"
    ) {
      valuesToSet[`${programDataPath}fields.program.hidden`] = true;
      valuesToSet[`${programDataPath}fields.programLabel.hidden`] = true;
    } else {
      valuesToSet[`${programDataPath}fields.program.hidden`] = false;
      valuesToSet[`${programDataPath}fields.programLabel.hidden`] = false;
    }

    api.setValues(valuesToSet);
  }

  function showHideUseValues(value) {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);

    // If this is an nested item, just return. (Like a weapon attachment)
    let pathToFields = "fields";
    if (nearestParentDataPath !== "") {
      pathToFields = `${nearestParentDataPath}.fields`;
    }

    const valuesToSet = {};

    if (value) {
      valuesToSet[`${pathToFields}.consumableProperties.hidden`] = false;
    } else if (!record.data?.consumable) {
      valuesToSet[`${pathToFields}.consumableProperties.hidden`] = true;
    }

    api.setValues(valuesToSet);
  }

  function showHideConsumableValues(value) {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);

    // If this is an nested item, just return. (Like a weapon attachment)
    let pathToFields = "fields";
    if (nearestParentDataPath !== "") {
      pathToFields = `${nearestParentDataPath}.fields`;
    }

    const valuesToSet = {};

    if (value) {
      valuesToSet[`${pathToFields}.consumableProperties.hidden`] = false;
    } else if (!record.data?.hasUseBtn) {
      valuesToSet[`${pathToFields}.consumableProperties.hidden`] = true;
    }

    api.setValues(valuesToSet);
  }

  function getWeaponSkillOptions() {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const item = api.getValue(nearestParentDataPath) || record;
    const itemType = item?.data?.type;
    if (itemType === "melee weapon") {
      return [
        { label: "Brawling", value: "Brawling" },
        { label: "Martial Arts", value: "Martial Arts" },
        { label: "Melee Weapon", value: "Melee Weapon" },
      ];
    }
    return [
      { label: "Archery", value: "Archery" },
      { label: "Autofire", value: "Autofire" },
      { label: "Handgun", value: "Handgun" },
      { label: "Heavy Weapons", value: "Heavy Weapons" },
      { label: "Shoulder Arms", value: "Shoulder Arms" },
      { label: "Pilot Sea Vehicle", value: "Pilot Sea Vehicle" },
      { label: "Pilot Air Vehicle", value: "Pilot Air Vehicle" },
      { label: "Drive Land Vehicle", value: "Drive Land Vehicle" },
      { label: "Drive Sea Vehicle", value: "Drive Sea Vehicle" },
      { label: "Drive Air Vehicle", value: "Drive Air Vehicle" },
    ];
  }

  function onAutofireChange(value) {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);

    // If this is an nested item, just return. (Like a weapon attachment)
    let pathToFields = "fields";
    if (nearestParentDataPath !== "") {
      pathToFields = `${nearestParentDataPath}.fields`;
    }

    if (value) {
      api.setValues({
        [`${pathToFields}.afDvProperties.hidden`]: false,
        [`${pathToFields}.autoFireBtn.hidden`]: false,
        [`${pathToFields}.singleDmgBtn.hidden`]: true,
        [`${pathToFields}.singleDmgBtnWhenAf.hidden`]: false,
        [`${pathToFields}.afDmgBtn.hidden`]: false,
      });
    } else {
      api.setValues({
        [`${pathToFields}.afDvProperties.hidden`]: true,
        [`${pathToFields}.autoFireBtn."hidden`]: true,
        [`${pathToFields}.singleDmgBtn.hidden`]: false,
        [`${pathToFields}.singleDmgBtnWhenAf.hidden`]: true,
        [`${pathToFields}.afDmgBtn.hidden`]: true,
      });
    }
  }

  function onSuppressiveFireChange(value) {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);

    // If this is an nested item, just return. (Like a weapon attachment)
    let pathToFields = "fields";
    if (nearestParentDataPath !== "") {
      pathToFields = `${nearestParentDataPath}.fields`;
    }

    if (value) {
      api.setValues({
        [`${pathToFields}.suppressiveFireBtn.hidden`]: false,
      });
    } else {
      api.setValues({
        [`${pathToFields}.suppressiveFireBtn.hidden`]: true,
      });
    }
  }

  function onCostChange(value) {
    const dataPathToItem = dataPath.replace(/[.]?data.cost/, "");
    const item = api.getValue(dataPathToItem) || record;

    const dataPathToPriceCategory = dataPath.replace(
      "data.cost",
      "data.priceCategory"
    );
    const dataPathToType = dataPath.replace("data.cost", "data.type");

    const valuesToSet = {
      [dataPathToPriceCategory]: "cheap",
    };

    // Convert value to a number to ensure proper comparisons
    const numValue = parseFloat(value.replace(/[a-zA-Z,]/g, "")) || 0;

    if (numValue >= 10000) {
      valuesToSet[dataPathToPriceCategory] = "super luxury";
    } else if (numValue >= 5000) {
      valuesToSet[dataPathToPriceCategory] = "luxury";
    } else if (numValue >= 1000) {
      valuesToSet[dataPathToPriceCategory] = "very expensive";
    } else if (numValue >= 500) {
      valuesToSet[dataPathToPriceCategory] = "expensive";
    } else if (numValue >= 100) {
      valuesToSet[dataPathToPriceCategory] = "premium";
    } else if (numValue >= 50) {
      valuesToSet[dataPathToPriceCategory] = "costly";
    } else if (numValue >= 20) {
      valuesToSet[dataPathToPriceCategory] = "everyday";
    } else if (numValue >= 10) {
      valuesToSet[dataPathToPriceCategory] = "cheap";
    } else if (numValue <= 5) {
      valuesToSet[dataPathToPriceCategory] = "dirt cheap";
    } else {
      // For values between 5 and 10
      valuesToSet[dataPathToPriceCategory] = "cheap";
    }

    // Ensure there is a defined type, for the purpose of filtering
    if (!item.data?.type) {
      valuesToSet[dataPathToType] = "gear";
    }

    // Apply the changes to the data model
    api.setValues(valuesToSet);
  }

  function onProgramsAndHardwareChange() {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const cyberdeck = api.getValue(nearestParentDataPath);
    const maxSlots = cyberdeck.data?.maxSlots || 3;

    const installedBlackICE = cyberdeck.data?.installedBlackICE || [];
    const installedProgramsAndHardware =
      cyberdeck.data?.installedProgramsAndHardware || [];

    const valuesToSet = {};

    // Get slots used
    let slotsUsed = 0;
    installedBlackICE.forEach((blackICE) => {
      // Black ICE always takes 2 slots (check field for future proofing if it takes more)
      const slots = Math.max(blackICE.data?.slots || 0, 2);
      slotsUsed += slots;
    });

    installedProgramsAndHardware.forEach((programOrHardware) => {
      slotsUsed += programOrHardware.data?.slots || 0;
    });

    valuesToSet[`${nearestParentDataPath}.data.slotsUsed`] = Math.min(
      slotsUsed,
      maxSlots
    );

    if (Object.keys(valuesToSet).length > 0) {
      api.setValues(valuesToSet);
    }
  }

  function onArmorLocationChange(value) {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const item = api.getValue(nearestParentDataPath) || record;

    // If this is an nested item, just return. (Like a weapon attachment)
    let pathToFields = "fields";
    if (nearestParentDataPath !== "") {
      pathToFields = `${nearestParentDataPath}.fields`;
    }

    const valuesToSet = {};

    if (value === "head") {
      valuesToSet[`${pathToFields}.curheadSp.hidden`] = false;
      valuesToSet[`${pathToFields}.curbodySp.hidden`] = true;
      valuesToSet[`${pathToFields}.curshieldSp.hidden`] = true;
    } else if (value === "body") {
      valuesToSet[`${pathToFields}.curheadSp.hidden`] = true;
      valuesToSet[`${pathToFields}.curbodySp.hidden`] = false;
      valuesToSet[`${pathToFields}.curshieldSp.hidden`] = true;
    } else if (value === "shield") {
      valuesToSet[`${pathToFields}.curheadSp.hidden`] = true;
      valuesToSet[`${pathToFields}.curbodySp.hidden`] = true;
      valuesToSet[`${pathToFields}.curshieldSp.hidden`] = false;
    }

    if (Object.keys(valuesToSet).length > 0) {
      api.setValues(valuesToSet);
    }
  }

  function onCyberwareInstallSlotChange(value) {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);

    // If this is an nested item, just return. (Like a weapon attachment)
    let pathToFields = "fields";
    if (nearestParentDataPath !== "") {
      pathToFields = `${nearestParentDataPath}.fields`;
    }

    if (value === "foundational") {
      api.setValues({
        [`${pathToFields}.optionSlots.hidden`]: false,
        [`${pathToFields}.slots.hidden`]: false,
      });
    } else {
      api.setValues({
        [`${pathToFields}.optionSlots.hidden`]: true,
        [`${pathToFields}.slots.hidden`]: false,
      });
    }
  }

  function onAttachmentsChange() {
    const nearestParentDataPath = getNearestParentDataPath(dataPath);
    const item = api.getValue(nearestParentDataPath) || record;

    let pathToData = "data";
    if (nearestParentDataPath !== "") {
      pathToData = `${nearestParentDataPath}.data`;
    }

    const attachments = value || [];

    // Make sure all attachments are of type "weapon attachment"
    const valuesToSet = {};
    attachments.forEach((attachment, index) => {
      if (attachment.data?.type !== "weapon attachment") {
        valuesToSet[`${pathToData}.attachments.${index}.data.type`] =
          "weapon attachment";
        valuesToSet[
          `${pathToData}.attachments.${index}.fields.weaponAttachmentProperties.hidden`
        ] = false;
        valuesToSet[
          `${pathToData}.attachments.${index}.fields.hasUseBtn.hidden`
        ] = false;
      }
    });

    // Get slots used
    let slotsUsed = 0;
    attachments.forEach((attachment) => {
      slotsUsed += attachment.data?.slots || 0;
    });

    const maxSlots = record.data?.maxSlots || 3;
    valuesToSet[`${pathToData}.slotsUsed`] = Math.min(slotsUsed, maxSlots);

    if (Object.keys(valuesToSet).length > 0) {
      api.setValues(valuesToSet);
    }
  }
</script>

<div

>
  <div style="display: flex; gap: 4px">
    <div

    >
      <portrait width="125px" height="125px" field="portrait"></portrait>
    </div>
    <div
      style="
        display: flex;
        gap: 4px;
        flex-direction: column;
        width: 100%;
        margin-bottom: 4px;
      "
    >
      <dropdown
        multiselect="1"
        placeholder="Select Type"
        onchange="showHideValues(value);"
        s
        field="type"
        label="Type"
        defaultvalue="gear"
        options='[{"label": "Agent App", "value": "agent app"}, {"label": "Ammo", "value": "ammo"}, {"label": "Armor", "value": "armor"}, {"label": "Black ICE", "value": "black ice"}, {"label": "Cyberdeck", "value": "cyberdeck"}, {"label": "Cyberware", "value": "cyberware"}, {"label": "Demon", "value": "demon"}, {"label": "Drone", "value": "drone"}, {"label": "Drug", "value": "drug"}, {"label": "Fashion", "value": "fashion"}, {"label": "Gear", "value": "gear"}, {"label": "Item Pack", "value": "pack"}, {"label": "Melee Weapon", "value": "melee weapon"}, {"label": "Program or Hardware", "value": "program or hardware"}, {"label": "Ranged Weapon", "value": "ranged weapon"}, {"label": "Vehicle", "value": "vehicle"}, {"label": "Vehicle Upgrade", "value": "vehicle upgrade"}, {"label": "Weapon Attachment", "value": "weapon attachment"}]'

        width="100%"
        field="humanityLoss"
        label="Humanity Loss"
        placeholder="Enter Humanity Loss Roll..."
        onchange="onHumanityLossChange(value);"
      ></stringfield>
      <div
        style="display: flex; flex-direction: column; width: 200px; gap: 4px"
      >
        <checkbox
          field="halfHumanityLoss"
          width="100%"
          label="Halved"
          textalign="left"
        ></checkbox>
        <checkbox
          field="borgware"
          width="100%"
          label="Borgware"
          textalign="left"
        ></checkbox>
      </div>
      <numberfield
        width="100%"
        field="baseHumanityLoss"
        label="Base Humanity Loss"
        placeholder="Enter Base HL..."
        minvalue="0"
      ></numberfield>
    </div>
  </box>

  <div
    style="
      display: flex;
      flex-direction: column;
      width: 100%;
      gap: 4px;
      margin-top: 4px;
    "
  >
    <label
      field="weaponAttachedLabel"
      label="Attached Weapon"
      hidden="true"
      size="sm"
      variant="bold"
      textalign="center"
    ></label>
    <label
      field="cyberwareWeaponLabel"
      label="Linked Weapon"
      hidden="true"
      size="sm"
      variant="bold"
      textalign="center"
    ></label>
    <list
      listtype="attachment_weapon_select_list"
      field="weaponAttached"
      variant="outline"
      hidden="true"
      allowadd="return isWeapon(value);"
    ></list>
  </div>

  <!-- Description -->

  <div style="margin-top: 8px">
    <divider label="Description"></divider>
  </div>

  <div style="margin-top: 8px">
    <richtextfield
      field="description"
      label="Description"
      placeholder="Enter Item description..."
      hidewhenidentified="false"
    >
    </richtextfield>
  </div>

  <stringfield
    field="unidentifiedDescription"
    label="Unidentified Description"
    placeholder="Enter description..."
    multiline="true"
    hidewhenidentified="true"
  >
  </stringfield>
</div>
