<script>
  function onChangeModifierType() {
    const modPath = dataPath.replace(".data.type", "");

    const valuesToSet = {};

    if (value === "statBonus") {

      valuesToSet[`${modPath}.fields.statSet.hidden`] = false;
      valuesToSet[`${modPath}.fields.statMaximum.hidden`] = false;
      valuesToSet[`${modPath}.fields.noDerivedAttributes.hidden`] = false;
    } else if (value === "statPenalty") {

      valuesToSet[`${modPath}.fields.statBonus.hidden`] = true;
      valuesToSet[`${modPath}.fields.statMaximum.hidden`] = true;

      valuesToSet[`${modPath}.fields.stat.hidden`] = false;
      valuesToSet[`${modPath}.fields.statPenalty.hidden`] = false;
      valuesToSet[`${modPath}.fields.statSet.hidden`] = false;
      valuesToSet[`${modPath}.fields.statMinimum.hidden`] = false;
      valuesToSet[`${modPath}.fields.noDerivedAttributes.hidden`] = false;
    } else if (value === "smartAmmo") {
      valuesToSet[`${modPath}.fields.field.hidden`] = false;
      valuesToSet[`${modPath}.fields.value.hidden`] = false;
      valuesToSet[`${modPath}.fields.valueType.hidden`] = false;

      valuesToSet[`${modPath}.fields.active.hidden`] = false;
      valuesToSet[`${modPath}.fields.itemOnly.hidden`] = false;

      valuesToSet[`${modPath}.fields.stat.hidden`] = true;
      valuesToSet[`${modPath}.fields.statBonus.hidden`] = true;
      valuesToSet[`${modPath}.fields.statPenalty.hidden`] = true;
      valuesToSet[`${modPath}.fields.statSet.hidden`] = true;
      valuesToSet[`${modPath}.fields.statMaximum.hidden`] = true;
      valuesToSet[`${modPath}.fields.statMinimum.hidden`] = true;
      valuesToSet[`${modPath}.fields.noDerivedAttributes.hidden`] = true;
    } else {
      valuesToSet[`${modPath}.fields.field.hidden`] = false;
      valuesToSet[`${modPath}.fields.value.hidden`] = false;
      valuesToSet[`${modPath}.fields.valueType.hidden`] = false;
      valuesToSet[`${modPath}.fields.active.hidden`] = false;
      valuesToSet[`${modPath}.fields.itemOnly.hidden`] = false;

      valuesToSet[`${modPath}.fields.smartBonus.hidden`] = true;
      valuesToSet[`${modPath}.fields.stat.hidden`] = true;
      valuesToSet[`${modPath}.fields.statBonus.hidden`] = true;
      valuesToSet[`${modPath}.fields.statPenalty.hidden`] = true;
      valuesToSet[`${modPath}.fields.statSet.hidden`] = true;

      valuesToSet[`${modPath}.fields.statMinimum.hidden`] = true;
      valuesToSet[`${modPath}.fields.noDerivedAttributes.hidden`] = true;
    }

    api.setValues(valuesToSet);
  }
</script>
