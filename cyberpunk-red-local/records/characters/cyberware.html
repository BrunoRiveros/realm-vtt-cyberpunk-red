  function onLoad() {
    // Accumulate everything we need to initialize in one batch.
    const valuesToSet = {};

    // If we haven't set the max slots yet, set them now
    if (
      record?.data?.neuralLinkOptionSlots === undefined ||
      record?.data?.leftCyberEyeOptionSlots === undefined ||
      record?.data?.rightCyberEyeOptionSlots === undefined ||
      record?.data?.cyberaudioSuiteOptionSlots === undefined ||
      record?.data?.chipwareOptionSlots === undefined ||
      record?.data?.internalOptionSlots === undefined ||
      record?.data?.externalOptionSlots === undefined ||
      record?.data?.rightCyberArmOptionSlots === undefined ||
      record?.data?.leftCyberArmOptionSlots === undefined ||
      record?.data?.rightCyberFingerOptionSlots === undefined ||
      record?.data?.leftCyberFingerOptionSlots === undefined ||
      record?.data?.leftCyberLegOptionSlots === undefined ||
      record?.data?.rightCyberLegOptionSlots === undefined ||
      record?.data?.fashionwareOptionSlots === undefined ||
      record?.data?.internalCyberwareOptionSlots === undefined ||
      record?.data?.externalCyberwareOptionSlots === undefined
    ) {
      // Set defaults, but will need to check on equip of foundational cyberware to update
      valuesToSet["data.neuralLinkOptionSlots"] = 5;
      valuesToSet["data.leftCyberEyeOptionSlots"] = 3;
      valuesToSet["data.rightCyberEyeOptionSlots"] = 3;
      valuesToSet["data.cyberaudioSuiteOptionSlots"] = 3;
      valuesToSet["data.chipwareOptionSlots"] = 1;
      valuesToSet["data.internalOptionSlots"] = 7;
      valuesToSet["data.externalOptionSlots"] = 7;
      valuesToSet["data.rightCyberArmOptionSlots"] = 4;
      valuesToSet["data.leftCyberArmOptionSlots"] = 4;
      valuesToSet["data.rightCyberFingerOptionSlots"] = 5;
      valuesToSet["data.leftCyberFingerOptionSlots"] = 5;
      valuesToSet["data.leftCyberLegOptionSlots"] = 3;
      valuesToSet["data.rightCyberLegOptionSlots"] = 3;
      valuesToSet["data.fashionwareOptionSlots"] = 7;
      valuesToSet["data.internalCyberwareOptionSlots"] = 7;
      valuesToSet["data.externalCyberwareOptionSlots"] = 7;
    }

    // First-open / migration for the canvas body navigator. Runs when no node
    // is selected OR the stored id is no longer valid (e.g. the legacy "head"
    // node), so a tab re-activation never resets the user's chosen location.
    const nodeIds = cyberNodes().map((n) => n.id);
    const selectedNode = record?.data?.cyberwareSelectedNode;
    if (selectedNode === undefined || nodeIds.indexOf(selectedNode) === -1) {
      valuesToSet["data.cyberwareSelectedNode"] = "neuralLink";
      cyberNodes().forEach((n) => {
        valuesToSet["fields." + n.panel + ".hidden"] = n.id !== "neuralLink";
      });
    }

    if (Object.keys(valuesToSet).length > 0) {
      api.setValues(valuesToSet, () => {
        paintBody();
      });
    } else {
      paintBody();
    }
  }

  function onDropItem(recordLink) {
    const item = recordLink?.value;

    const isCyberware = item?.data?.type === "cyberware";

    if (!isCyberware) {
      return;
    }

    // Add the cyberware to inventory and set the attunement hidden field to visible if requires attunement
    const itemToAdd = {
      ...item,
      icon: "IconBox",
      data: {
        ...item?.data,
        // Track old ID for count tracking
        fromId: item._id,
        // Default count to 1
        count: 1,
        // Mark it as equipped
        carried: "equipped",
      },
      fields: {
        ...item?.fields,
      },
    };

    // If this is cyberware, and we haven't set the active status, set it to true
    const activeStatus = item.data?.active;
    if (activeStatus === undefined || activeStatus === null) {
      itemToAdd.data.active = true;
    }
    // If it's foundational cyberware, we need to update the option slots
    if (
      item.data?.cyberwareInstallSlot === "foundational" &&
      // Hands and feet go in arms and legs
      item.data?.foundationalSlot !== "left hand" &&
      item.data?.foundationalSlot !== "right hand" &&
      item.data?.foundationalSlot !== "left foot" &&
      item.data?.foundationalSlot !== "right foot"
    ) {
      const optionSlots = item.data?.optionSlots;
      const foundationalSlot = item.data?.foundationalSlot;
      const leftOrRight = foundationalSlot.toLowerCase().includes("left")
        ? "left"
        : "right";
      const optionSlotValue = getOptionSlotValue(
        foundationalSlot,
        leftOrRight
      );
      if (optionSlotValue.fieldName) {
        itemToAdd.data[`${optionSlotValue.fieldName}`] =
          optionSlots || optionSlotValue.defaultValue;
      }
    } else {
      // On the cyberware list, we'll store if it's left or right, if required
      let leftOrRight = item.data?.cyberLocation;
      if (!leftOrRight) {
        if (item.data?.cyberwareInstallSlot === "cyberoptics") {
          // Determine which eye we should use
          const leftEye = (record?.data?.inventory || []).filter(
            (item) =>
              item.data?.cyberwareInstallSlot === "foundational" &&
              item.data?.foundationalSlot === "left cybereye" &&
              item.data?.carried === "equipped" &&
              item.data?.type === "cyberware"
          )?.[0];
          const rightEye = (record?.data?.inventory || []).filter(
            (item) =>
              item.data?.cyberwareInstallSlot === "foundational" &&
              item.data?.foundationalSlot === "right cybereye" &&
              item.data?.carried === "equipped" &&
              item.data?.type === "cyberware"
          )?.[0];
          const numSlotsLeftEye =
            record?.data?.usedLeftCyberEyeOptionSlots || 0;
          const numSlotsRightEye =
            record?.data?.usedRightCyberEyeOptionSlots || 0;
          if (!leftEye && !rightEye) {
            leftOrRight = "right";
          } else if (!rightEye) {
            leftOrRight = "left";
          } else if (!leftEye) {
            leftOrRight = "right";
          } else if (numSlotsLeftEye < numSlotsRightEye) {
            leftOrRight = "left";
          } else {
            leftOrRight = "right";
          }
          itemToAdd.data.cyberLocation = leftOrRight;
          if (!itemToAdd.fields) itemToAdd.fields = {};
          itemToAdd.fields.moveLeftBtn = {
            hidden: leftOrRight === "left" ? true : false,
          };
          itemToAdd.fields.moveRightBtn = {
            hidden: leftOrRight === "right" ? true : false,
          };
        } else if (item.data?.cyberwareInstallSlot === "cyberfingers") {
          // Determine which hand we should use
          const leftHand = (record?.data?.inventory || []).filter(
            (item) =>
              item.data?.cyberwareInstallSlot === "foundational" &&
              item.data?.foundationalSlot === "left hand" &&
              item.data?.carried === "equipped" &&
              item.data?.type === "cyberware"
          )?.[0];
          const rightHand = (record?.data?.inventory || []).filter(
            (item) =>
              item.data?.cyberwareInstallSlot === "foundational" &&
              item.data?.foundationalSlot === "right hand" &&
              item.data?.carried === "equipped" &&
              item.data?.type === "cyberware"
          )?.[0];
          const numSlotsLeftHand =
            record?.data?.usedLeftCyberFingerOptionSlots || 0;
          const numSlotsRightHand =
            record?.data?.usedRightCyberFingerOptionSlots || 0;
          if (!leftHand && !rightHand) {
            leftOrRight = "right";
          } else if (!rightHand) {
            leftOrRight = "left";
          } else if (!leftHand) {
            leftOrRight = "right";
          } else if (numSlotsLeftHand < numSlotsRightHand) {

          } else {
            leftOrRight = "right";
          }
          itemToAdd.data.cyberLocation = leftOrRight;
          if (!itemToAdd.fields) itemToAdd.fields = {};
          itemToAdd.fields.moveLeftBtn = {

          itemToAdd.fields.moveRightBtn = {
            hidden: leftOrRight === "right" ? true : false,

        } else if (
          item.data?.cyberwareInstallSlot === "cyberarms" ||

          item.data?.foundationalSlot === "left hand"
        ) {
          // Determine which arm we should use

            (item) =>

              item.data?.foundationalSlot === "left cyberarm" &&
              item.data?.carried === "equipped" &&

          const rightArm = (record?.data?.inventory || []).filter(

          const numSlotsLeftArm =

          itemToAdd.fields.moveRightBtn = {

          };
        } else if (
          item.data?.cyberwareInstallSlot === "cyberlegs" ||
          item.data?.foundationalSlot === "right foot" || // Feet use slots in the leg
          item.data?.foundationalSlot === "left foot"
        ) {
          // Determine which leg we should use
          const leftLeg = (record?.data?.inventory || []).filter(
            (item) =>
              item.data?.cyberwareInstallSlot === "foundational" &&
              item.data?.foundationalSlot === "left cyberleg" &&
              item.data?.carried === "equipped" &&
              item.data?.type === "cyberware"
          )?.[0];
          const rightLeg = (record?.data?.inventory || []).filter(
            (item) =>
              item.data?.cyberwareInstallSlot === "foundational" &&
              item.data?.foundationalSlot === "right cyberleg" &&
              item.data?.carried === "equipped" &&
              item.data?.type === "cyberware"
          )?.[0];
          const numSlotsLeftLeg =
            record?.data?.usedLeftCyberLegOptionSlots || 0;
          const numSlotsRightLeg =
            record?.data?.usedRightCyberLegOptionSlots || 0;
          if (!leftLeg && !rightLeg) {
            leftOrRight = "right";
          } else if (!rightLeg) {
            leftOrRight = "left";
          } else if (!leftLeg) {
            leftOrRight = "right";
          } else if (numSlotsLeftLeg < numSlotsRightLeg) {
            leftOrRight = "left";
          } else {
            leftOrRight = "right";
          }
          itemToAdd.data.cyberLocation = leftOrRight;
          if (!itemToAdd.fields) itemToAdd.fields = {};
          itemToAdd.fields.moveLeftBtn = {
            hidden: leftOrRight === "left" ||
              item.data?.foundationalSlot === "left foot" ||
              item.data?.foundationalSlot === "right foot"
                ? true
                : false
          };
          itemToAdd.fields.moveRightBtn = {
            hidden: leftOrRight === "right" ||
              item.data?.foundationalSlot === "left foot" ||
              item.data?.foundationalSlot === "right foot"
                ? true
                : false
          };
        }
      }
    }

    // Add the item to the list then update the cyberware slot values
    api.addValue(`data.inventory`, itemToAdd, (updatedRecord) => {
      // Update all stats again
      const valuesToSet = {};
      const bestEquippedArmor = getBestEquippedArmor(updatedRecord);

      valuesToSet["data.headArmor"] = bestEquippedArmor.head[0]?.name || "";
      valuesToSet["data.headArmorSP"] = bestEquippedArmor.head[0]?.curSp || 0;
      valuesToSet["data.headArmorPenalty"] =
        bestEquippedArmor.head[0]?.penalty || 0;

  function onDrop(type, recordLink) {
    if (type === "items") {

  function getCyberwareFoundationalFiltersFor(type) {
    // Only show cyberware that matches the foundational type
    const filters = [
      {
        field: "foundationalSlot",
        operator: "equals",
        value: type,
      },
      {
        field: "cyberwareInstallSlot",
        operator: "equals",
        value: "foundational",
      },
    ];

    return filters;
  }

  function getCyberwareFiltersFor(type, location) {
    // If the type is 'gear' we show all cyberware that has been set
    // to 'withinGear'
    if (type === "gear") {
      return [
        {
          field: "withinGear",
          operator: "equals",
          value: true,
        },
      ];
    }

    // Only show cyberware that matches the foundational type
    const filters = [
      {
        field: "cyberwareInstallSlot",
        operator: "equals",
        value: type,
      },
      {
        field: "withinGear",
        operator: "not_equals",
        value: true,
      },
    ];

    if (location) {
      filters.push({
        field: "cyberLocation",
        operator: "equals",
        value: location,
      });
    }

    // If this is an arm or left, also show foundational left/right hands/feet
    if (type === "cyberarms" || type === "cyberlegs") {
      let secondaryType = "hand";
      if (type === "cyberlegs") {
        secondaryType = "foot";
      }
      filters.push({
        field: "foundationalSlot",
        operator: "equals",
        value: `${location} ${secondaryType}`,
        isOr: true,
      });
      filters.push({
        field: "cyberLocation",
        operator: "equals",
        value: location,
        isOr: false,
      });
      filters.push({
        field: "carried",
        operator: "equals",
        value: "equipped",
        isOr: false,
      });
      filters.push({
        field: "type",
        operator: "equals",
        value: "cyberware",
        isOr: false,
      });
    }

    return filters;
  }

  /* =====================================================================
     Canvas cyber-body navigator
     The <canvas> is a visual navigator only. Clicking a body region (node)
     reveals that region's focus panel of <list> components on the right.
     All cyberware data / slot math / humanity rolls live in the existing
     list templates and common.js -- this code only reads and paints.
     ===================================================================== */

  // Ordered node descriptors. id = selection key (data.cyberwareSelectedNode),
  // panel = the <box> field revealed when the node is selected.
  function cyberNodes() {
    return [
      { id: "neuralLink", label: "Neural Link", panel: "panelNeural", kind: "body" },
      { id: "cyberaudio", label: "Cyberaudio", panel: "panelCyberaudio", kind: "body" },
      { id: "rightEye", label: "R Eye", panel: "panelRightEye", kind: "body" },
      { id: "leftEye", label: "L Eye", panel: "panelLeftEye", kind: "body" },
      { id: "rightArm", label: "R Arm", panel: "panelRightArm", kind: "body" },
      { id: "leftArm", label: "L Arm", panel: "panelLeftArm", kind: "body" },
      { id: "torso", label: "Internal / External", panel: "panelTorso", kind: "body" },
      { id: "rightLeg", label: "R Leg", panel: "panelRightLeg", kind: "body" },
      { id: "leftLeg", label: "L Leg", panel: "panelLeftLeg", kind: "body" },
      { id: "fashionware", label: "Fashionware", panel: "panelFashionware", kind: "footer" },
      { id: "borgware", label: "Borgware", panel: "panelBorgware", kind: "footer" },
      { id: "gear", label: "In Gear", panel: "panelGear", kind: "footer" },
    ];
  }

  function canvasTheme() {

      bg: api.getThemeColor("background"),
      surface: api.getThemeColor("surface"),
      surfaceHover: api.getThemeColor("surfaceHover"),

  // Rounded-rect path helper (arcTo based; caller does fill()/stroke()).
  function rr(c, x, y, w, h, r) {
    const rad = Math.max(0, Math.min(r, w / 2, h / 2));
    c.beginPath();
    c.moveTo(x + rad, y);
    c.arcTo(x + w, y, x + w, y + h, rad);
    c.arcTo(x + w, y + h, x, y + h, rad);
    c.arcTo(x, y + h, x, y, rad);
    c.arcTo(x, y, x + w, y, rad);
    c.closePath();
  }

  // Compute node chip rects from the live canvas size so autosize works.
  function bodyLayout() {
    const c = api.getCanvas("cyberBodyCanvas");
    if (!c) return null;
    const W = c.width;
    const H = c.height;
    if (W < 40 || H < 40) return null;
    const cx = W / 2;

    const hud = { x: 6, y: 6, w: W - 12, h: 56 };
    const footerH = 80;
    const footerTop = H - footerH - 6;
    const bodyTop = hud.y + hud.h + 10;
    const bodyBot = footerTop - 8;
    const bodyH = Math.max(140, bodyBot - bodyTop);

    const mk = (id, ncx, ncy, w, h) => ({
      id: id,
      x: ncx - w / 2,
      y: ncy - h / 2,
      w: w,
      h: h,
    });

    const headChipW = Math.max(72, W * 0.32);
    const armW = Math.max(64, W * 0.27);
    const legW = Math.max(60, W * 0.26);
    const torsoW = Math.max(126, W * 0.46);
    const headDX = W * 0.22;
    const armDX = W * 0.27;
    const legDX = W * 0.16;

    const nodes = [
      // Head cluster: two columns flanking the head -- Neural Link over
      // R Eye on the left, Cyberaudio over L Eye on the right.
      mk("neuralLink", cx - headDX, bodyTop + bodyH * 0.05, headChipW, 34),
      mk("cyberaudio", cx + headDX, bodyTop + bodyH * 0.05, headChipW, 34),
      mk("rightEye", cx - headDX, bodyTop + bodyH * 0.16, headChipW, 34),
      mk("leftEye", cx + headDX, bodyTop + bodyH * 0.16, headChipW, 34),
      mk("rightArm", cx - armDX, bodyTop + bodyH * 0.4, armW, 34),
      mk("leftArm", cx + armDX, bodyTop + bodyH * 0.4, armW, 34),
      mk("torso", cx, bodyTop + bodyH * 0.55, torsoW, 44),
      mk("rightLeg", cx - legDX, bodyTop + bodyH * 0.85, legW, 34),
      mk("leftLeg", cx + legDX, bodyTop + bodyH * 0.85, legW, 34),
    ];

    // Footer strip: 3 equal chips for the non-anatomical sections.
    const fGap = 6;
    const fPad = 6;
    const fW = (W - fPad * 2 - fGap * 2) / 3;
    const fH = footerH - 12;
    const fY = footerTop + 6;
    ["fashionware", "borgware", "gear"].forEach((id, i) => {
      nodes.push({
        id: id,
        x: fPad + i * (fW + fGap),
        y: fY,
        w: fW,
        h: fH,
      });
    });

    return {
      c: c,
      W: W,
      H: H,
      cx: cx,
      hud: hud,
      bodyTop: bodyTop,
      bodyBot: bodyBot,
      bodyH: bodyH,
      footerTop: footerTop,
      nodes: nodes,
    };
  }

  // Classify an inventory item to a navigator node id (or null).
  function nodeForItem(item) {
    const d = item && item.data;
    if (!d || d.type !== "cyberware" || d.carried !== "equipped") return null;
    if (d.withinGear === true) return "gear";
    const slot = d.cyberwareInstallSlot;
    const fnd = (d.foundationalSlot || "").toLowerCase();
    if (slot === "foundational") {
      if (fnd === "neural link") return "neuralLink";
      if (fnd === "cyberaudio suite") return "cyberaudio";
      if (fnd === "left cybereye") return "leftEye";
      if (fnd === "right cybereye") return "rightEye";
      if (fnd === "left cyberarm" || fnd === "left hand") return "leftArm";
      if (fnd === "right cyberarm" || fnd === "right hand") return "rightArm";
      if (fnd === "left cyberleg" || fnd === "left foot") return "leftLeg";
      if (fnd === "right cyberleg" || fnd === "right foot") return "rightLeg";
      return null;
    }
    // Neuralware and Chipware are both managed under the Neural Link panel.
    if (slot === "neuralware" || slot === "chipware") return "neuralLink";
    if (slot === "cyberaudio") return "cyberaudio";
    if (slot === "cyberoptics")
      return d.cyberLocation === "left" ? "leftEye" : "rightEye";
    if (slot === "cyberarms" || slot === "cyberfingers")
      return d.cyberLocation === "left" ? "leftArm" : "rightArm";
    if (slot === "cyberlegs")
      return d.cyberLocation === "left" ? "leftLeg" : "rightLeg";
    if (
      slot === "internal body cyberware" ||
      slot === "external body cyberware"
    )
      return "torso";
    if (slot === "fashionware") return "fashionware";
    if (slot === "borgware") return "borgware";
    return null;
  }

  // Per-node { used, max, count, slots }. used/max read the precomputed
  // data.*OptionSlots fields (kept current by common.js setCyberwareSlotValues)
  // so chip numbers always match the focus-panel counters.
  function computeAllNodeAggregates(data) {
    const g = (k) => Number(data[k]) || 0;
    const agg = {
      neuralLink: {
        used: g("usedNeuralLinkOptionSlots"),
        max: g("neuralLinkOptionSlots"),
        count: 0,
        slots: true,
      },
      cyberaudio: {
        used: g("usedCyberaudioSuiteOptionSlots"),
        max: g("cyberaudioSuiteOptionSlots"),
        count: 0,
        slots: true,
      },
      rightEye: {
        used: g("usedRightCyberEyeOptionSlots"),
        max: g("rightCyberEyeOptionSlots"),
        count: 0,
        slots: true,
      },
      leftEye: {
        used: g("usedLeftCyberEyeOptionSlots"),
        max: g("leftCyberEyeOptionSlots"),
        count: 0,
        slots: true,
      },
      leftArm: {
        used: g("usedLeftCyberArmOptionSlots"),
        max: g("leftCyberArmOptionSlots"),
        count: 0,
        slots: true,
      },
      rightArm: {
        used: g("usedRightCyberArmOptionSlots"),
        max: g("rightCyberArmOptionSlots"),
        count: 0,
        slots: true,
      },
      leftLeg: {
        used: g("usedLeftCyberLegOptionSlots"),
        max: g("leftCyberLegOptionSlots"),
        count: 0,
        slots: true,
      },
      rightLeg: {
        used: g("usedRightCyberLegOptionSlots"),
        max: g("rightCyberLegOptionSlots"),
        count: 0,
        slots: true,
      },
      torso: {
        used:
          g("usedInternalCyberwareOptionSlots") +
          g("usedExternalCyberwareOptionSlots"),
        max:
          g("internalCyberwareOptionSlots") +
          g("externalCyberwareOptionSlots"),
        count: 0,
        slots: true,
      },
      fashionware: {
        used: g("usedFashionwareOptionSlots"),
        max: g("fashionwareOptionSlots"),
        count: 0,
        slots: true,
      },
      borgware: { used: 0, max: 0, count: 0, slots: false },
      gear: { used: 0, max: 0, count: 0, slots: false },
    };

    // Mark which nodes can host a foundational (base) implant, e.g. the
    // Cyberarm itself. Torso / Fashionware / Borgware / Gear have none.
    [
      "neuralLink",
      "cyberaudio",
      "rightEye",
      "leftEye",
      "leftArm",
      "rightArm",
      "leftLeg",
      "rightLeg",
    ].forEach((id) => {
      if (agg[id]) {
        agg[id].foundationCapable = true;
        agg[id].foundation = false;
      }
    });

    const inv = Array.isArray(data.inventory) ? data.inventory : [];
    inv.forEach((it) => {
      const n = nodeForItem(it);
      if (!n || !agg[n]) return;
      agg[n].count++;
      if (it.data && it.data.cyberwareInstallSlot === "foundational") {
        agg[n].foundation = true;
      }
    });
    return agg;
  }

  function nodeTooltipText(desc, agg) {
    const a = agg || {};
    const cnt = (a.count || 0) + " item" + (a.count === 1 ? "" : "s");
    let text = a.slots
      ? desc.label +
        " - " +
        (a.used || 0) +
        "/" +
        (a.max || 0) +
        " slots, " +
        cnt
      : desc.label + " - " + cnt;
    if (a.foundationCapable) {
      text += a.foundation
        ? " (foundational installed)"
        : " (no foundational)";
    }
    return text;
  }

  // Draw the provided cyber-body SVG centered in the body area, preserving
  // aspect ratio. The figure's fills are re-themed (#888 -> primary, the two
  // near-white fills -> surface) so the body picks up the active theme.
  // Async: drawSVG yields on a cold cache, paints synchronously once warmed.
  async function drawBodyImage(c, lay, theme) {
    if (typeof c.drawSVG !== "function") return;

    const svg = BODY_SVG.split("#888")
      .join(theme.primary)
      .split("#FCFCFC")
      .join(theme.surface)
      .split("#FDFDFD")
      .join(theme.surface);

    // Nudge the figure down a touch; keep it fitted within the body area.
    const offsetY = 15;
    const availH = lay.bodyH - offsetY;
    const svgAspect = 1024 / 1536;
    let sw = lay.W;
    let sh = sw / svgAspect;
    if (sh > availH) {
      sh = availH;
      sw = sh * svgAspect;
    }
    const sx = (lay.W - sw) / 2;
    const sy = lay.bodyTop + offsetY + (availH - sh) / 2;
    await c.drawSVG(svg, sx, sy, sw, sh);
  }

  function drawHud(c, lay, theme, data) {
    const h = lay.hud;

    rr(c, h.x, h.y, h.w, h.h, 6);
    c.setFillStyle(theme.surface);
    c.fill();
    rr(c, h.x, h.y, h.w, h.h, 6);
    c.setStrokeStyle(theme.border);
    c.setLineWidth(1);
    c.stroke();

    const cur = Number(data.curHumanity) || 0;
    let max = Number(data.totalHumanity) || 0;
    if (!max) max = Number(data.humanity) || 0;
    const emp = Number(data.curEmp) || 0;
    const ratio = max > 0 ? Math.max(0, Math.min(1, cur / max)) : 0;

    c.setFillStyle(theme.textDim);
    c.setFont("bold 10px sans-serif");
    c.setTextBaseline("alphabetic");
    c.setTextAlign("left");
    c.fillText("HUMANITY", h.x + 10, h.y + 16);
    c.setTextAlign("right");
    c.fillText("EMP " + emp, h.x + h.w - 10, h.y + 16);

    const barX = h.x + 10;
    const barY = h.y + 24;
    const barW = h.w - 20;
    const barH = 13;
    rr(c, barX, barY, barW, barH, 4);
    c.setFillStyle(theme.border);
    c.fill();

    let barColor = theme.success;
    if (ratio < 0.2) barColor = theme.error;
    else if (ratio < 0.5) barColor = theme.warning;
    if (ratio > 0) {
      rr(c, barX, barY, Math.max(4, barW * ratio), barH, 4);
      c.setFillStyle(barColor);
      c.fill();
    }

    c.setFillStyle(theme.text);
    c.setFont("bold 11px sans-serif");
    c.setTextAlign("center");
    c.setTextBaseline("middle");
    c.fillText(cur + " / " + max, h.x + h.w / 2, barY + barH / 2 + 1);
  }

  function drawNode(c, node, desc, agg, selected, hovered, theme) {
    const x = node.x;
    const y = node.y;
    const w = node.w;
    const h = node.h;

    rr(c, x, y, w, h, 6);
    c.setFillStyle(
      selected
        ? theme.primary
        : hovered
        ? theme.surfaceHover
        : theme.surface
    );
    c.fill();
    rr(c, x, y, w, h, 6);
    c.setStrokeStyle(selected ? theme.primary : theme.border);
    c.setLineWidth(selected ? 2 : 1);
    c.stroke();

    const hasSlots = agg && agg.slots;
    const fg = selected
      ? theme.primaryContrast
      : desc.id === "gear"
      ? theme.textDim
      : theme.text;
    const dim = selected ? theme.primaryContrast : theme.textDim;

    c.setFillStyle(fg);
    c.setFont("bold 11px sans-serif");
    c.setTextAlign("center");
    c.setTextBaseline("alphabetic");
    c.fillText(desc.label, x + w / 2, hasSlots ? y + h / 2 - 1 : y + h / 2 + 4);

    if (hasSlots) {
      const used = agg.used || 0;
      const max = agg.max || 0;
      let col = dim;
      if (!selected) {
        if (used > max) col = theme.error;
        else if (max > 0 && used === max) col = theme.warning;
      }
      c.setFillStyle(col);
      c.setFont("10px sans-serif");
      c.fillText(used + " / " + max + " slots", x + w / 2, y + h / 2 + 12);
    }

    // Equipped-count badge, top-right corner.
    const count = agg ? agg.count || 0 : 0;
    const bx = x + w - 9;
    const by = y + 9;
    c.beginPath();
    c.arc(bx, by, 8, 0, Math.PI * 2);
    c.setFillStyle(
      count > 0
        ? selected
          ? theme.primaryContrast
          : theme.primary
        : theme.border
    );
    c.fill();
    c.setFillStyle(
      count > 0
        ? selected
          ? theme.primary
          : theme.primaryContrast
        : theme.textDim
    );
    c.setFont("bold 9px sans-serif");
    c.setTextAlign("center");
    c.setTextBaseline("middle");
    c.fillText(String(count), bx, by + 1);

    // Foundational (base implant) indicator, top-left corner: a filled dot
    // when the base implant is installed, a hollow ring when it is missing.
    if (agg && agg.foundationCapable) {
      const fx = x + 9;
      const fy = y + 9;
      c.beginPath();
      c.arc(fx, fy, 5.5, 0, Math.PI * 2);
      if (agg.foundation) {
        c.setFillStyle(selected ? theme.primaryContrast : theme.success);
        c.fill();
      } else {
        c.setStrokeStyle(selected ? theme.primaryContrast : theme.textDim);
        c.setLineWidth(1.5);
        c.stroke();
      }
    }
  }

  // Single repaint entry point. Async because the body SVG draw yields on a
  // cold image cache; concurrent calls simply end with the latest paint.
  async function paintBody() {
    const c = api.getCanvas("cyberBodyCanvas");
    if (!c) return;
    const lay = bodyLayout();
    if (!lay) return;
    const theme = canvasTheme();
    const data = api.getValue("data") || (record && record.data) || {};
    const selectedId = data.cyberwareSelectedNode || "neuralLink";
    const hoverId = api.getSession("cyberwareHover") || null;
    const agg = computeAllNodeAggregates(data);

    const descById = {};
    cyberNodes().forEach((n) => {
      descById[n.id] = n;
    });

    c.clearRect(0, 0, lay.W, lay.H);
    c.clearTooltips();
    c.setFillStyle(theme.bg);
    c.fillRect(0, 0, lay.W, lay.H);

    await drawBodyImage(c, lay, theme);
    drawHud(c, lay, theme, data);

    // Divider line above the footer strip.
    c.setStrokeStyle(theme.border);
    c.setLineWidth(1);
    c.beginPath();
    c.moveTo(8, lay.footerTop);
    c.lineTo(lay.W - 8, lay.footerTop);
    c.stroke();

    lay.nodes.forEach((node) => {
      const desc = descById[node.id];
      if (!desc) return;
      drawNode(
        c,
        node,
        desc,
        agg[node.id],
        node.id === selectedId,
        node.id === hoverId,
        theme
      );
      c.tooltip(
        node.x,
        node.y,
        node.w,
        node.h,
        nodeTooltipText(desc, agg[node.id])
      );
    });
  }

  function nodeHitTest(x, y, lay) {
    for (let i = 0; i < lay.nodes.length; i++) {
      const n = lay.nodes[i];
      if (x >= n.x && x <= n.x + n.w && y >= n.y && y <= n.y + n.h) return n;
    }
    return null;
  }

  function onCanvasClick() {
    const lay = bodyLayout();
    if (!lay) return;
    const hit = nodeHitTest(event.x, event.y, lay);
    if (!hit) return;
    if (api.getValue("data.cyberwareSelectedNode") === hit.id) return;

    // One patch: record the selection + flip every focus panel's visibility.
    const valuesToSet = { "data.cyberwareSelectedNode": hit.id };
    cyberNodes().forEach((n) => {
      valuesToSet["fields." + n.panel + ".hidden"] = n.id !== hit.id;
    });
    api.setValues(valuesToSet, () => {
      paintBody();
    });
  }

  function onCanvasMove() {
    const lay = bodyLayout();
    if (!lay) return;
    const hit = nodeHitTest(event.x, event.y, lay);
    const id = hit ? hit.id : null;
    const prev = api.getSession("cyberwareHover") || null;
    if (prev !== id) {
      api.setSession("cyberwareHover", id);
      paintBody();
    }
  }

  function onCanvasLeave() {
    if (api.getSession("cyberwareHover")) {
      api.setSession("cyberwareHover", null);
      paintBody();
    }
  }

  function onCanvasRecordChange() {
    // Equip / remove / move cyberware -> refresh node counts and the HUD.
    paintBody();
  }
</script>
