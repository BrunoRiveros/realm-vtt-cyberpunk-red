<!-- This list is just the foundational cyberware equipped for a specific type -->
<script>
  const rollHumanityLoss = (name) => {
    const cyberwareDataPath = getNearestParentDataPath(dataPath);
    const cyberware = api.getValue(cyberwareDataPath);
    const baseLoss = `${cyberware.data?.baseHumanityLoss}` || "0";
    const rollLoss = cyberware.data?.humanityLoss || "1d6";
    const metadata = {
      // Always use base loss if base is selected, else check if half loss is enabled
      halfHumanityLoss:
        name === "Base" ? false : cyberware.data?.halfHumanityLoss || false,
      isBaseLoss: name === "Base",
    };

    api.closeOpenedPopovers();

    api.promptRoll(
      `${name} Humanity Loss`,
      name === "Base" ? baseLoss : rollLoss,
      [],
      metadata,
      "humanityLoss"
    );
  };
</script>
